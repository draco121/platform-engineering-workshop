# Runs the security gate against the demo app on every push.
#
# On the original repository this run is RED ON PURPOSE: the demo app ships
# libraries with known vulnerabilities, and the gate blocks it.
# Lab 1's CI challenge: fork the repo, fix demo-app/pom.xml, and make it green.
name: gates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  security-gate:
    name: Security gate (OSV.dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: List every library the demo app ships (direct + transitive)
        working-directory: demo-app
        run: mvn -B -q dependency:list -DoutputFile=deps.txt -DincludeScope=runtime
      - name: Security gate
        run: python gates/osv_gate.py --deps-file demo-app/deps.txt --fail-on HIGH --json-out osv-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: osv-report
          path: osv-report.json
