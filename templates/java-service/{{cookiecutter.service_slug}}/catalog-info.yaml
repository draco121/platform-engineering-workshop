# Registers this service in the developer portal's software catalog (Backstage format),
# so anyone can find out what it does and who to call when it breaks.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: {{ cookiecutter.service_slug }}
  description: {{ cookiecutter.description }}
  tags: [java, spring-boot, golden-path]
spec:
  type: service
  lifecycle: experimental
  owner: {{ cookiecutter.owner_team }}
