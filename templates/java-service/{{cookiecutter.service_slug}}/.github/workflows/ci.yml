# Generated by the golden path. Your team owns the "build" job;
# the platform team owns the gates - they live in ONE central place
# so every service in the company gets the same rules (and the same fixes).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "{{ cookiecutter.java_version }}"
          cache: maven
      - name: Build, test and check formatting
        run: mvn -B verify

  platform-gates:
    needs: build
    uses: {{ cookiecutter.platform_gates_repo }}/.github/workflows/platform-gates.yml@main
    with:
      platform_repo: {{ cookiecutter.platform_gates_repo }}
      java_version: "{{ cookiecutter.java_version }}"
